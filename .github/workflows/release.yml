name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Suppress archgate CLI telemetry in CI so in-development cli_version values
  # don't pollute PostHog product-usage metrics. Harmless for workflows that
  # don't run the CLI.
  ARCHGATE_TELEMETRY: "0"

jobs:
  build:
    name: Build WASM plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: moonrepo/build-wasm-plugin@c446bcf166358a243559500352935eefbd58dd79 # v0
        id: build

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            builds/*.wasm
            builds/*.sha256
          fail_on_unmatched_files: true

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Catches proto releases that break the plugin API, without waiting for a
  # commit here to trigger a run.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Suppress archgate CLI telemetry in CI so in-development cli_version values
  # don't pollute PostHog product-usage metrics.
  ARCHGATE_TELEMETRY: "0"
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy rustfmt
          rustup target add wasm32-wasip1

      - name: Check formatting
        run: cargo fmt --check

      - name: Check lints
        run: cargo clippy --target wasm32-wasip1 --release -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: moonrepo/build-wasm-plugin@c446bcf166358a243559500352935eefbd58dd79 # v0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin
          path: builds/*.wasm
          if-no-files-found: error
          retention-days: 7

  # Installs the built plugin with a real proto host. This is the check that
  # catches WASM API drift: a plugin that compiles cleanly still fails here when
  # proto changes the shape of a context struct the plugin deserializes.
  compat:
    name: proto ${{ matrix.proto }} / ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor declared by minimum_proto_version. Proves the claim is honest.
          - os: ubuntu-latest
            proto: "0.60.0"
          # Whatever proto ships today, across every OS the plugin supports.
          - os: ubuntu-latest
            proto: latest
          - os: macos-latest
            proto: latest
          - os: windows-latest
            proto: latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: plugin
          path: plugin

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          proto-version: ${{ matrix.proto }}
          # A warm ~/.proto would let a cached plugin or tool mask a real break.
          cache: false
          auto-install: false

      - name: Configure the plugin under test
        run: |
          cat > .prototools <<'TOML'
          archgate = "latest"

          [plugins]
          archgate = "file://./plugin/archgate_tool.wasm"
          TOML
          cat .prototools

      - name: Install the tool
        run: proto install archgate

      - name: Verify the installed binary runs
        run: |
          output=$(proto run archgate -- --version)
          # Trailing CR on Windows, and proto may prepend notices to stdout.
          version=$(printf '%s\n' "${output}" | tr -d '\r' | grep -v '^$' | tail -n1)
          echo "archgate reported: ${version}"
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' <<<"${version}"; then
            echo "::error::Expected a semantic version from 'archgate --version', got '${version}'"
            exit 1
          fi

  # Single required status check. Branch protection points at this job, so the
  # compat matrix can grow or shrink without editing the protection rule.
  ci:
    name: CI
    if: always()
    needs:
      - lint
      - build
      - compat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: ${results}"
          for result in ${results}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required job did not succeed (${results})"
              exit 1
            fi
          done
